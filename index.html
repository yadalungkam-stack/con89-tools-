<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<base target="_top">
<title>ทะเบียนเครื่องมือ CON89</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: tool-crib register — header, three tabs (board / history / monthly), rows tagged like yellow tool tags */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --sunk:#F6F7F8; --ink:#1B2027; --muted:#5D6672; --line:#D9DDE2;
  --accent:#F2B705; --accent-ink:#1B2027; --accent-soft:#FFF4CC;
  --ok:#23784A; --ok-soft:#E3F2E9; --out:#1F5FBF; --out-soft:#E3ECFA; --late:#B42318; --late-soft:#FBE7E5; --warn:#A35A06; --warn-soft:#FCEFD9;
  --shadow:0 1px 2px rgba(27,32,39,.06),0 6px 24px rgba(27,32,39,.08);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121519; --surface:#1A1E24; --sunk:#151820; --ink:#E6E9ED; --muted:#99A2AD; --line:#2B3139;
  --accent:#F5C518; --accent-ink:#15181C; --accent-soft:#3A3212;
  --ok:#5CC08A; --ok-soft:#173225; --out:#7AA8F0; --out-soft:#1B2A44; --late:#F07A70; --late-soft:#3D1D1B; --warn:#F0A957; --warn-soft:#3A2A14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121519; --surface:#1A1E24; --sunk:#151820; --ink:#E6E9ED; --muted:#99A2AD; --line:#2B3139;
  --accent:#F5C518; --accent-ink:#15181C; --accent-soft:#3A3212;
  --ok:#5CC08A; --ok-soft:#173225; --out:#7AA8F0; --out-soft:#1B2A44; --late:#F07A70; --late-soft:#3D1D1B; --warn:#F0A957; --warn-soft:#3A2A14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1120px;margin:0 auto;padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.tagmark{width:46px;height:56px;background:var(--accent);color:var(--accent-ink);border-radius:6px 6px 10px 10px;position:relative;
  display:grid;place-items:end center;padding-bottom:8px;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.tagmark::before{content:"";position:absolute;top:8px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--bg)}
.brand h1{font-size:26px;font-weight:700;line-height:1.15}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(.96)}
.btn.danger{background:var(--late);border-color:var(--late);color:#fff}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.stat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stat .k{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.ok .v{color:var(--ok)} .stat.out .v{color:var(--out)} .stat.late .v{color:var(--late)}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-width:0}
.toolbar .search{flex:1 1 240px}
.toolbar select{flex:0 1 200px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:56px minmax(0,1.3fr) minmax(0,1.6fr) auto;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.thumb{all:unset;cursor:pointer;width:56px;height:56px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;
  color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:18px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.thumb:focus-visible{outline:2px solid var(--accent)}
.photo{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:10px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:14px}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.photo-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.photo-bar input[type=file]{display:none}
.tname .tag{align-self:flex-start;margin-bottom:3px}
.qrbtn{padding:5px 7px;display:inline-grid;place-items:center}
.qrbtn svg{width:18px;height:18px;display:block}
.qrbig{width:min(300px,100%);margin:0 auto}
.qrbig svg,.qrmini svg{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line)}
.qrrow{display:flex;gap:14px;align-items:center;background:var(--sunk);border-radius:10px;padding:10px}
.qrmini{all:unset;cursor:pointer;width:96px;flex:none}
.qrmini:focus-visible{outline:2px solid var(--accent)}
.row:first-child{border-top:0}
.row.is-late{background:linear-gradient(90deg,var(--late-soft),transparent 40%)}
.tag{font-family:var(--f-mono);font-weight:600;font-size:12.5px;background:var(--accent);color:var(--accent-ink);border-radius:4px 4px 4px 4px;
  padding:3px 8px 3px 16px;position:relative;white-space:nowrap;letter-spacing:.02em}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--surface)}
.tname{display:flex;flex-direction:column;min-width:0}
.tname button{all:unset;cursor:pointer;font-weight:600;overflow-wrap:anywhere}
.tname button:hover{text-decoration:underline}
.tname button:focus-visible{outline:2px solid var(--accent)}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.where{display:flex;flex-direction:column;gap:2px;min-width:0}
.where .loc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.out{background:var(--out-soft);color:var(--out)}
.pill.late{background:var(--late-soft);color:var(--late)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){
  .row{grid-template-columns:56px minmax(0,1fr);row-gap:8px}
  .row .where{grid-column:1 / -1}
  .row .actions{grid-column:1 / -1;justify-content:flex-start}
}

.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{color:var(--ink);font-size:19px}
.empty p{margin:0;max-width:46ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:17px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:.02em;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.nowrap{white-space:nowrap}

.monthbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.monthbar h2{font-size:22px;min-width:9ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .k{font-size:12.5px;color:var(--muted)} .kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .u{font-size:13px;color:var(--muted);margin-left:4px;font-family:var(--f-body);font-weight:400}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.chart .bar{fill:var(--out)} .chart .bar.today{fill:var(--accent)}
.chart .grid{stroke:var(--line);stroke-width:1} .chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.usage{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.usage i{display:block;width:60px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.usage i b{display:block;height:100%;background:var(--out)}

.modal{position:fixed;inset:0;background:rgba(15,18,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:100%;overflow:auto;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:21px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin-top:-8px}
form.f{display:flex;flex-direction:column;gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted);min-width:0}
.f label > span b{color:var(--late);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 11px;color:var(--ink);font-size:15px;width:100%;min-width:0}
.f textarea{min-height:64px;resize:vertical}
.f .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:460px){.f .two{grid-template-columns:minmax(0,1fr)}}
.f .err{color:var(--late);font-size:13.5px;min-height:1em}
.f .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.route{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 12px}
.route .arrow{color:var(--muted)}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding-bottom:14px;position:relative}
.timeline li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{width:14px;height:14px;border-radius:50%;margin-top:4px;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--out);background:var(--out)}
.timeline .dot.home{box-shadow:0 0 0 2px var(--ok);background:var(--ok)}
.timeline .dot.now{box-shadow:0 0 0 2px var(--accent);background:var(--accent)}
.timeline .t{font-weight:600}
.timeline .d{font-size:13px;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.dl dt{color:var(--muted)} .dl dd{margin:0;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--late);color:#fff}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}

/* base reset (HtmlService has none) */
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>

<div class="app">

<script>/*__BOOT__*/</script>
<script>
/* ===== ชั้นเชื่อมต่อ Google Apps Script =====
 * หน้าเว็บเดิมเรียกข้อมูลผ่าน db/assets/downloads แบบหนึ่ง ส่วนนี้แปลงคำสั่งเหล่านั้นไปเรียก Code.gs
 * ข้อมูลรีเฟรชอัตโนมัติทุก 20 วินาทีขณะเปิดหน้า และทันทีหลังบันทึก */
(function () {
  const listeners = { tools: [], moves: [] };
  let data = { tools: [], moves: [] }, polling = null;

  function gas(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) { reject({ code: 'unavailable', message: 'offline' }); return; }
      google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) {
        reject({ code: 'server', message: (err && err.message) || String(err) });
      })[fn].apply(null, args);
    });
  }
  function snap(name) {
    const docs = (data[name] || []).map(function (row) {
      const body = Object.assign({}, row); delete body.id;
      ['dueAt', 'backAt', 'endType', 'fromSite'].forEach(function (k) { if (body[k] === '') body[k] = null; });
      return { id: row.id, exists: true, data: function () { return body; } };
    });
    if (name === 'moves') docs.sort(function (a, b) { return String(b.data().outAt) < String(a.data().outAt) ? -1 : 1; });
    return { docs: docs, size: docs.length, empty: !docs.length };
  }
  function emit() { ['tools', 'moves'].forEach(function (n) { listeners[n].forEach(function (l) { try { l.next(snap(n)); } catch (e) { console.error(e); } }); }); }
  function apply(d) { if (d && d.tools) { data = d; emit(); } return d; }
  function refresh() {
    return gas('getData').then(apply).catch(function (e) {
      ['tools', 'moves'].forEach(function (n) { listeners[n].forEach(function (l) { l.error && l.error({ code: 'unavailable', message: e.message }); }); });
    });
  }
  function startPolling() {
    if (polling) return;
    refresh();
    polling = setInterval(function () { if (document.visibilityState === 'visible' && document.getElementById('modal').hidden) refresh(); }, 20000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refresh(); });
  }
  function newId(table) { return (table === 'moves' ? 'm' : 't') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function send(ops) {
    return gas('write', ops).then(apply).catch(function (e) {
      const msg = e.message || '';
      if (/ถูกเบิกออกไปแล้ว|ถูกปิดไปแล้ว/.test(msg)) refresh();
      throw { code: 'conflict', message: msg };
    });
  }
  function docRef(table, id) {
    return {
      id: id,
      update: function (d) { return send([{ op: 'update', table: table, id: id, data: d, guard: (table === 'moves' && d.backAt) ? 'moveOpen' : '' }]); },
      set: function (d) { return send([{ op: 'set', table: table, id: id, data: d, guard: (table === 'moves' && !d.backAt) ? 'toolAvailable' : '' }]); },
      delete: function () { return send([{ op: 'delete', table: table, id: id }]); }
    };
  }
  function collection(table) {
    const q = {
      orderBy: function () { return q; }, limit: function () { return q; },
      doc: function (id) { return docRef(table, id || newId(table)); },
      onSnapshot: function (next, error) {
        const l = { next: next, error: error }; listeners[table].push(l);
        if (data.tools.length || data.moves.length) setTimeout(function () { next(snap(table)); }, 0);
        startPolling();
        return function () { listeners[table] = listeners[table].filter(function (x) { return x !== l; }); };
      }
    };
    return q;
  }
  const DB = {
    collection: collection,
    doc: function (path) { const p = path.split('/'); return docRef(p[0], p[1]); }
  };
  const ASSETS = {
    upload: function (blob) {
      return new Promise(function (res, rej) {
        const r = new FileReader();
        r.onload = function () { res(String(r.result).split(',')[1]); };
        r.onerror = function () { rej({ code: 'invalid_request' }); };
        r.readAsDataURL(blob);
      }).then(function (b64) { return gas('uploadPhoto', b64, 'tool-' + Date.now()); })
        .then(function (id) { return { id: id, url: 'https://drive.google.com/thumbnail?id=' + id + '&sz=w800' }; });
    },
    delete: function () { return Promise.resolve({ deleted: false }); }
  };
  const DL = {
    save: function (req) {
      const blob = req.data instanceof Blob ? req.data : new Blob([req.data]);
      const url = URL.createObjectURL(blob);
      if (/\.png$/i.test(req.filename)) {
        // แสดงรูปให้กดค้างบันทึกได้ (มือถือบางรุ่นไม่ยอมดาวน์โหลดจากหน้า Apps Script)
        const sheet = document.getElementById('sheet');

          '<p class="meta" style="margin:0">มือถือ: กดค้างที่รูปแล้วเลือก "บันทึกรูปภาพ" · คอมพิวเตอร์: กดปุ่มด้านล่าง</p>' +
          '<div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" data-act="close">ปิด</button>' +
          '<a class="btn primary" href="' + url + '" download="' + req.filename.replace(/"/g, '') + '" target="_self" style="text-decoration:none">ดาวน์โหลด</a></div>';
        document.getElementById('modal').hidden = false;
        return Promise.resolve({ ok: true });
      }
      const a = document.createElement('a'); a.href = url; a.download = req.filename; a.target = '_self';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      return Promise.resolve({ ok: true });
    }
  };
  window.claude = { use: function (name) { return Promise.resolve({ db: DB, assets: ASSETS, downloads: DL }[name] || null); } };
})();

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const OFFICE = 'ออฟฟิศ CON89';
const APP_URL = (window.BOOT && BOOT.appUrl) || '';
const PRESET_CATS = ['เครื่องมือไฟฟ้า','เครื่องมือวัด/สำรวจ','เครื่องมือช่างทั่วไป','อุปกรณ์งานคอนกรีต','อุปกรณ์ความปลอดภัย','บันได/นั่งร้าน','เครื่องจักร/ปั๊ม/เครื่องปั่นไฟ'];
const COND = {ok:'ปกติ', damaged:'ชำรุด', repair:'ส่งซ่อม'};
const DAY = 86400000;
function lastPerson(){ try { return localStorage.getItem('con89.person') || ''; } catch(e){ return ''; } }
function rememberPerson(p){ try { localStorage.setItem('con89.person', p); } catch(e){} }

let db = null, assets = null, canWrite = true;
let tools = [], moves = [];
const ready = {tools:false, moves:false};
const S = {tab:'board', filter:'all', q:'', cat:'', hq:'', hmonth:'', month: ymKey(new Date())};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ymKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function fmtD(iso){ if(!iso) return '–'; const d = new Date(iso.length===10 ? iso+'T12:00:00' : iso); return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}); }
function fmtDT(iso){ if(!iso) return '–'; const d = new Date(iso); return fmtD(iso) + ' ' + d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) + ' น.'; }
function monthLabel(key){ const [y,m] = key.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'}); }
function nowLocal(){ const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function toISO(local){ return local ? new Date(local).toISOString() : new Date().toISOString(); }
function dueEnd(due){ return due ? new Date(due+'T23:59:59') : null; }
function daysBetween(a,b){ return Math.max(0,(b-a)/DAY); }
function n1(x){ return (Math.round(x*10)/10).toLocaleString('th-TH'); }

/* ---------- derived state ---------- */
function openMove(toolId){ return moves.find(m => m.toolId===toolId && !m.backAt); }
function toolState(t){
  const m = openMove(t.id);
  if(!m) return {kind:'home', m:null};
  const late = m.dueAt && Date.now() > dueEnd(m.dueAt).getTime();
  return {kind: late ? 'late' : 'out', m};
}
function photoSrc(t){ return t.photoId && /^[A-Za-z0-9_-]{20,}$/.test(t.photoId) ? 'https://drive.google.com/thumbnail?id=' + t.photoId + '&sz=w800' : ''; }
function thumbHTML(t){
  const s = photoSrc(t), ch = esc(String(t.name||'?').trim().charAt(0));
  return s ? `<img src="${s}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${ch}'))">` : ch;
}
async function shrink(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
}
async function setPhoto(t, file){
  if(!assets){ toast('บัญชีนี้อัปโหลดรูปไม่ได้', true); return; }
  if(!file || !/^image\//.test(file.type)){ toast('เลือกไฟล์รูปภาพ', true); return; }
  toast('กำลังอัปโหลดรูป…');
  let up;
  try { up = await assets.upload(await shrink(file), {type:'image/jpeg'}); }
  catch(e){ toast(e && e.code==='quota_or_state' ? 'พื้นที่เก็บรูปเต็ม' : 'อัปโหลดรูปไม่สำเร็จ ลองอีกครั้ง', true); return; }
  const old = t.photoId;
  const ok = await write(() => db.doc('tools/'+t.id).update({photoId: up.id}), 'บันทึกรูปแล้ว');
  if(ok && old && old !== up.id){ try { await assets.delete(old); } catch(e){} }
  const fresh = toolById(t.id); if(fresh && !$('#modal').hidden && $('#sheet [data-photo-of]')) detailSheet({...fresh, photoId: up.id});
}
const QR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>';
const qrCache = {};
function qrSVG(t){
  if(typeof qrcode !== 'function') return '<div class="meta" style="padding:20px;text-align:center">โหลดตัวสร้าง QR ไม่สำเร็จ</div>';
  if(qrCache[t.id]) return qrCache[t.id];
  const qr = qrcode(0, 'M'); qr.addData(APP_URL + '?t=' + encodeURIComponent(t.id)); qr.make();
  const n = qr.getModuleCount(); let d = '';
  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return qrCache[t.id] = `<svg viewBox="-3 -3 ${n+6} ${n+6}" role="img" aria-label="QR Code ${esc(t.code)}"><rect x="-3" y="-3" width="${n+6}" height="${n+6}" fill="#ffffff"/><path d="${d}" fill="#000000" shape-rendering="crispEdges"/></svg>`;
}
function qrSheet(t){
  openSheet(`<h2>QR Code</h2><p class="sub"><span class="tag">${esc(t.code)}</span> ${esc(t.name)}</p>
    <div class="qrbig">${qrSVG(t)}</div>
    <p class="meta" style="text-align:center;margin:0">สแกนเพื่อเปิดหน้าเบิก / คืนของเครื่องมือชิ้นนี้</p>
    <div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap">
      <button class="btn" data-act="detail" data-id="${t.id}">ดูรายละเอียด</button>
      <button class="btn primary" data-act="qr" data-id="${t.id}">ดาวน์โหลด QR</button></div>`);
}
function sortedTools(){ return [...tools].sort((a,b)=> String(a.code).localeCompare(String(b.code),'th',{numeric:true})); }
function toolById(id){ return tools.find(t=>t.id===id); }

/* ---------- boot ---------- */
(async () => {
  render();
  const use = window.claude && window.claude.use;
  if(!use){ notice('เปิดหน้านี้ผ่าน claude.ai เพื่อบันทึกและดูข้อมูลร่วมกันกับทีม'); ready.tools = ready.moves = true; render(); return; }
  try { db = await window.claude.use('db'); } catch(e){ db = null; }
  if(!db){ notice('ยังเชื่อมต่อฐานข้อมูลไม่ได้ ลองลงชื่อเข้าใช้ claude.ai แล้วเปิดหน้านี้อีกครั้ง'); ready.tools = ready.moves = true; render(); return; }
  try {
    const u = await window.claude.use('user');
    if(u){ const c = await u.can('data.write'); if(c === false) setReadOnly(); }
  } catch(e){}
  try { assets = await window.claude.use('assets'); } catch(e){ assets = null; }
  db.collection('tools').onSnapshot(s => { tools = s.docs.map(d => ({id:d.id, ...d.data()})); ready.tools = true; render(); }, dbErr);
  db.collection('moves').orderBy('outAt','desc').limit(1000).onSnapshot(s => { moves = s.docs.map(d => ({id:d.id, ...d.data()})); ready.moves = true; render(); }, dbErr);
})();
function dbErr(e){ notice('โหลดข้อมูลไม่สำเร็จ (' + (e && e.code || 'unavailable') + ') ลองรีเฟรชหน้านี้'); }
function notice(t){ const n = $('#notice'); n.textContent = t; n.hidden = false; }
function setReadOnly(){ canWrite = false; notice('คุณเปิดดูได้อย่างเดียว ถ้าต้องบันทึกการเบิก/คืน ให้เจ้าของหน้านี้แชร์สิทธิ์ระดับ Contributor ขึ้นไป'); $('#btnAddTool').hidden = true; }

async function write(fn, okMsg){
  if(!db){ toast('ยังไม่ได้เชื่อมต่อฐานข้อมูล', true); return false; }
  try { await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    const c = e && e.code;
    if(c === 'invalid_argument'){ setReadOnly(); toast('บันทึกไม่ได้ คุณไม่มีสิทธิ์แก้ไขข้อมูล', true); render(); }
    else if(c === 'quota_exceeded') toast('พื้นที่เก็บข้อมูลเต็ม ลบประวัติเก่าบางส่วนก่อน', true);
    else toast(e && e.code === 'conflict' && e.message ? e.message : 'บันทึกไม่สำเร็จ ลองอีกครั้ง', true);
    return false;
  }
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab===S.tab)));
  $('#view-board').hidden = S.tab!=='board';
  $('#view-history').hidden = S.tab!=='history';

/* ---------- QR scan: link opens with #<toolId> ---------- */
var pendingHash = '';
function readHash(){ const h = (window.BOOT && BOOT.scan) || ''; pendingHash = /^[A-Za-z0-9._~-]+$/.test(h) ? h : ''; if(window.BOOT) BOOT.scan = ''; }
readHash();
window.addEventListener('hashchange', () => { readHash(); tryHash(); });
function tryHash(){
  if(!pendingHash || !ready.tools || !ready.moves) return;
  const id = pendingHash; pendingHash = '';
  if(!db) return;
  const t = toolById(id);
  if(!t){ toast('ไม่พบเครื่องมือจาก QR นี้ อาจถูกลบออกจากทะเบียนแล้ว', true); return; }
  if(canWrite && toolState(t).kind === 'home') checkoutForm(t); else detailSheet(t);
}

function wrapText(g, text, maxW, maxLines){
  let parts;
  try { parts = Array.from(new Intl.Segmenter('th', {granularity:'word'}).segment(text), s => s.segment); }
  catch(e){ parts = Array.from(text); }
  const lines = []; let cur = '';
  for(const p of parts){
    if(g.measureText(cur + p).width <= maxW || !cur){ cur += p; continue; }
    lines.push(cur.trim()); cur = p.trimStart();
    if(lines.length === maxLines) break;
  }
  if(lines.length < maxLines && cur) lines.push(cur.trim());
  if(lines.length === maxLines && parts.join('').length > lines.join('').length + 1){
    let l = lines[maxLines-1]; while(l && g.measureText(l + '…').width > maxW) l = l.slice(0, -1); lines[maxLines-1] = l + '…';
  }
  return lines;
}
async function downloadQR(t){
  if(typeof qrcode !== 'function'){ toast('โหลดตัวสร้าง QR ไม่สำเร็จ ลองรีเฟรชหน้า', true); return; }
  const qr = qrcode(0, 'M'); qr.addData(APP_URL + '?t=' + encodeURIComponent(t.id)); qr.make();
  const n = qr.getModuleCount();
  const W = 1200, H = 720, pad = 56, cell = Math.floor((H - pad*2) / n), qs = cell * n;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  try { await Promise.all([document.fonts.load('700 44px "Bai Jamjuree"'), document.fonts.load('500 32px "IBM Plex Sans Thai"')]); } catch(e){}
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#BBB'; g.lineWidth = 3; g.setLineDash([14, 10]); g.strokeRect(6, 6, W-12, H-12); g.setLineDash([]);
  const qx = pad, qy = (H - qs) / 2;
  g.fillStyle = '#000';
  for(let r = 0; r < n; r++) for(let col = 0; col < n; col++) if(qr.isDark(r, col)) g.fillRect(qx + col*cell, qy + r*cell, cell, cell);
  const x0 = qx + qs + 48, tw = W - x0 - pad;
  let y = qy + 8;
  g.font = '700 42px "Bai Jamjuree","IBM Plex Sans Thai",sans-serif'; g.textBaseline = 'top';
  const codeLines = wrapText(g, t.code, tw - 36, 2), codeH = codeLines.length * 54 + 22;
  g.fillStyle = '#F2B705'; g.beginPath(); (g.roundRect ? g.roundRect(x0, y, Math.min(tw, Math.max(...codeLines.map(l => g.measureText(l).width)) + 36), codeH, 12) : g.rect(x0, y, tw, codeH)); g.fill();
  g.fillStyle = '#111'; codeLines.forEach((l, i) => g.fillText(l, x0 + 18, y + 12 + i*54));
  y += codeH + 28;
  g.font = '700 48px "Bai Jamjuree","IBM Plex Sans Thai",sans-serif';
  wrapText(g, t.name, tw, 3).forEach(l => { g.fillText(l, x0, y); y += 64; });
  g.font = '500 34px "IBM Plex Sans Thai",sans-serif'; g.fillStyle = '#333';
  g.fillText('สแกนเพื่อเบิก / คืน', x0, H - pad - 90);
  g.font = '500 28px "IBM Plex Sans Thai",sans-serif'; g.fillStyle = '#777';
  g.fillText('CON89 Tool', x0, H - pad - 40);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  try {
    const dl = window.claude && await window.claude.use('downloads');
    if(!dl){ toast('ดาวน์โหลดไม่ได้ในมุมมองนี้', true); return; }
    await dl.save({filename: `QR-${t.code}.png`, data: blob});
  } catch(e){ if(e && e.code && e.code !== 'cancelled' && e.code !== 'declined') toast('ดาวน์โหลดไม่สำเร็จ', true); }
}

function fillDatalists(){
  const people = new Set(), sites = new Set(), cats = new Set(PRESET_CATS);
  moves.forEach(m => { if(m.person) people.add(m.person); if(m.site) sites.add(m.site); });
  tools.forEach(t => t.category && cats.add(t.category));
  $('#dlPeople').innerHTML = [...people].map(p=>`<option value="${esc(p)}">`).join('');
  $('#dlSites').innerHTML = [...sites].map(p=>`<option value="${esc(p)}">`).join('');
  $('#dlCats').innerHTML = [...cats].map(p=>`<option value="${esc(p)}">`).join('');
  const sel = $('#cat'), used = [...new Set(tools.map(t=>t.category).filter(Boolean))].sort();
  const html = '<option value="">ทุกหมวด</option>' + used.map(c=>`<option ${c===S.cat?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('');
  if(sel.innerHTML !== html) sel.innerHTML = html;
}

function renderBoard(){
  const all = sortedTools().map(t => ({t, st: toolState(t)}));
  const cnt = {all: all.length, home: all.filter(x=>x.st.kind==='home').length, out: all.filter(x=>x.st.kind!=='home').length, late: all.filter(x=>x.st.kind==='late').length};
  const statDefs = [['all','ทั้งหมด',''],['home','อยู่ออฟฟิศ','ok'],['out','ถูกเบิกออก','out'],['late','เกินกำหนดคืน','late']];
  $('#stats').innerHTML = statDefs.map(([k,l,c]) => `<button class="stat ${c}" data-filter="${k}" aria-pressed="${S.filter===k}"><span class="k">${l}</span><span class="v">${ready.tools?cnt[k]:'–'}</span></button>`).join('');

  const list = $('#toolList');
  if(!ready.tools || !ready.moves){ list.innerHTML = `<div class="empty"><p>กำลังโหลดทะเบียนเครื่องมือ…</p></div>`; return; }
  if(!tools.length){
    list.innerHTML = `<div class="empty"><h3>ยังไม่มีเครื่องมือในทะเบียน</h3>
      <p>เริ่มจากเพิ่มเครื่องมือชิ้นแรก เช่น <b>DR-01 สว่านไร้สาย</b> แล้วกด “เบิก” ทุกครั้งที่มีคนนำออกจากออฟฟิศ ระบบจะจำว่าใครเอาไปไซต์ไหนและสรุปให้รายเดือน</p>
      ${canWrite && db ? '<button class="btn primary" data-act="addTool">+ เพิ่มเครื่องมือชิ้นแรก</button>' : ''}</div>`;
    return;
  }
  const q = S.q.trim().toLowerCase();
  const rows = all.filter(({t,st}) => {
    if(S.filter==='home' && st.kind!=='home') return false;
    if(S.filter==='out' && st.kind==='home') return false;
    if(S.filter==='late' && st.kind!=='late') return false;
    if(S.cat && t.category!==S.cat) return false;
    if(q){ const hay = [t.code,t.name,t.brand,t.serial,t.category, st.m&&st.m.person, st.m&&st.m.site].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  if(!rows.length){ list.innerHTML = `<div class="empty"><p>ไม่พบเครื่องมือที่ตรงกับตัวกรองนี้</p></div>`; return; }
  list.innerHTML = rows.map(({t,st}) => {
    const cond = t.condition && t.condition!=='ok' ? `<span class="pill warn">${COND[t.condition]}</span>` : '';
    let where, acts;
    if(st.kind==='home'){
      where = `<div class="loc"><span class="pill ok">อยู่ออฟฟิศ</span>${cond}</div><span class="meta">${esc(OFFICE)}</span>`;
      acts = canWrite && db ? `<button class="btn sm primary" data-act="checkout" data-id="${t.id}">เบิก</button>` : '';
    } else {
      const m = st.m, days = Math.floor(daysBetween(new Date(m.outAt), new Date()));
      where = `<div class="loc"><span class="pill ${st.kind}">${st.kind==='late'?'เกินกำหนด':'ถูกเบิก'}</span><b>${esc(m.site)}</b>${cond}</div>
        <span class="meta">${esc(m.person)} · ออกเมื่อ ${fmtD(m.outAt)} (${days} วัน)${m.dueAt?` · กำหนดคืน ${fmtD(m.dueAt)}`:''}</span>`;
      acts = canWrite && db ? `<button class="btn sm" data-act="transfer" data-id="${t.id}">ส่งต่อ</button><button class="btn sm primary" data-act="return" data-id="${t.id}">คืน</button>` : '';
    }
    return `<div class="row ${st.kind==='late'?'is-late':''}">
      <button class="thumb" data-act="detail" data-id="${t.id}" aria-label="ดูรายละเอียด ${esc(t.name)}">${thumbHTML(t)}</button>
      <div class="tname"><span class="tag">${esc(t.code)}</span><button data-act="detail" data-id="${t.id}">${esc(t.name)}</button><span class="meta">${esc([t.category,t.brand].filter(Boolean).join(' · ') || '—')}</span></div>
      <div class="where">${where}</div>
      <div class="actions"><button class="btn sm qrbtn" data-act="qrshow" data-id="${t.id}" aria-label="QR ของ ${esc(t.code)}" title="QR Code">${QR_ICON}</button>${acts}</div></div>`;
  }).join('');
}

function monthOptions(){
  const set = new Set([ymKey(new Date())]);
  moves.forEach(m => { set.add(ymKey(new Date(m.outAt))); if(m.backAt) set.add(ymKey(new Date(m.backAt))); });
  return [...set].sort().reverse();
}

function renderHistory(){

  const rows = moves.filter(m => {

    }).join('') + '</tbody></table>';

/* ---------- monthly summary ---------- */
function monthStats(key){
  const [y,mo] = key.split('-').map(Number);
  const start = new Date(y,mo-1,1), end = new Date(y,mo,1), now = new Date();
  const cap = end < now ? end : now;
  const daysInMonth = Math.round((end-start)/DAY);
  const elapsed = Math.max(0, Math.min(daysInMonth, (cap-start)/DAY));
  const byTool = {}, byPerson = {}, bySite = {};
  let checkouts=0, transfers=0, returns=0, lateReturns=0, toolDays=0;
  const inMonth = [];
  for(const m of moves){
    const s = new Date(m.outAt), e = m.backAt ? new Date(m.backAt) : now;
    const ov = Math.max(0, (Math.min(e, end, now) - Math.max(s, start)) / DAY);
    const startsIn = s >= start && s < end;
    if(startsIn){ if(m.fromSite) transfers++; else checkouts++; }
    if(m.backAt && m.endType==='returned'){ const b = new Date(m.backAt); if(b>=start && b<end){ returns++; if(m.dueAt && b > dueEnd(m.dueAt)) lateReturns++; } }
    if(ov<=0 && !startsIn) continue;
    inMonth.push(m);
    toolDays += ov;
    const t = byTool[m.toolId] ||= {code:m.toolCode, name:m.toolName, times:0, days:0};
    const p = byPerson[m.person] ||= {name:m.person, times:0, days:0, tools:new Set()};
    const st = bySite[m.site] ||= {name:m.site, times:0, days:0, tools:new Set()};
    if(startsIn){ t.times++; p.times++; st.times++; }
    t.days += ov; p.days += ov; st.days += ov; p.tools.add(m.toolId); st.tools.add(m.toolId);
  }
  // daily: distinct tools out each day
  const daily = [];
  for(let i=0;i<daysInMonth;i++){
    const ds = new Date(y,mo-1,1+i), de = new Date(y,mo-1,2+i);
    if(ds > now){ daily.push(null); continue; }
    const set = new Set();
    for(const m of moves){ const s = new Date(m.outAt), e = m.backAt ? new Date(m.backAt) : now; if(s < de && e > ds) set.add(m.toolId); }
    daily.push(set.size);
  }
  const overdueNow = moves.filter(m => !m.backAt && m.dueAt && now > dueEnd(m.dueAt)).length;
  const sortD = o => Object.values(o).sort((a,b)=> b.days-a.days || b.times-a.times);
  return {start, end, daysInMonth, elapsed, checkouts, transfers, returns, lateReturns, toolDays, overdueNow, daily, inMonth,
    tools: sortD(byTool), people: sortD(byPerson), sites: sortD(bySite), isCurrent: key===ymKey(now)};
}

function chartSVG(daily, isCurrent){
  const W=720, H=200, L=30, R=8, T=10, B=26, n=daily.length;
  const max = Math.max(1, ...daily.map(v=>v||0));
  const step = max<=5 ? 1 : max<=10 ? 2 : Math.ceil(max/5);
  const top = Math.ceil(max/step)*step;
  const cw = (W-L-R)/n, bw = Math.max(4, cw*0.66);
  const y = v => T + (H-T-B) * (1 - v/top);
  let g = '';
  for(let v=0; v<=top; v+=step) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const today = new Date().getDate()-1;
  daily.forEach((v,i)=>{
    const x = L + i*cw + (cw-bw)/2;
    if(v) g += `<rect class="bar ${isCurrent&&i===today?'today':''}" x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0)-y(v)).toFixed(1)}" rx="2"><title>วันที่ ${i+1}: ${v} ชิ้น</title></rect>`;
    if(i===0 || (i+1)%5===0 || i===n-1) g += `<text x="${(L+i*cw+cw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${i+1}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="จำนวนเครื่องมือที่อยู่นอกออฟฟิศรายวัน">${g}</svg>`;
}

      <div class="panel"><h3>รายผู้เบิก</h3>${tableGroup(M.people,'ผู้เบิก')}</div>
      <div class="panel"><h3>รายไซต์งาน</h3>${tableGroup(M.sites,'ไซต์')}</div>
    </div>`;
}
function tableTools(M){
  if(!M.tools.length) return '<p class="meta">ยังไม่มีข้อมูลในเดือนนี้</p>';
  return `<div class="scroll"><table><thead><tr><th>รหัส</th><th>เครื่องมือ</th><th class="n">เบิก (ครั้ง)</th><th class="n">อยู่นอกออฟฟิศ (วัน)</th><th class="n">อัตราใช้งาน</th></tr></thead><tbody>` +
    M.tools.map(t => { const p = M.elapsed ? Math.min(100, t.days/M.elapsed*100) : 0;
      return `<tr><td><span class="tag">${esc(t.code)}</span></td><td>${esc(t.name)}</td><td class="n">${t.times}</td><td class="n">${n1(t.days)}</td>
      <td class="n"><span class="usage"><i><b style="width:${p.toFixed(0)}%"></b></i>${p.toFixed(0)}%</span></td></tr>`; }).join('') + '</tbody></table></div>';
}
function tableGroup(rows, label){
  if(!rows.length) return '<p class="meta">ยังไม่มีข้อมูลในเดือนนี้</p>';
  return `<div class="scroll"><table><thead><tr><th>${label}</th><th class="n">ครั้ง</th><th class="n">ชิ้น</th><th class="n">เครื่องมือ-วัน</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${esc(r.name)}</td><td class="n">${r.times}</td><td class="n">${r.tools.size}</td><td class="n">${n1(r.days)}</td></tr>`).join('') + '</tbody></table></div>';
}

async function downloadCsv(){
  const M = monthStats(S.month);
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const r1 = x => Math.round(x*10)/10;
  const lines = [];
  lines.push([q('สรุปการใช้เครื่องมือ CON89'), q(monthLabel(S.month))].join(','));
  lines.push([q('เบิกออก (ครั้ง)'),M.checkouts].join(',')); lines.push([q('คืน (ครั้ง)'),M.returns].join(','));
  lines.push([q('คืนช้า (ครั้ง)'),M.lateReturns].join(',')); lines.push([q('ส่งต่อระหว่างไซต์ (ครั้ง)'),M.transfers].join(','));
  lines.push([q('เครื่องมือ-วัน นอกออฟฟิศ'),r1(M.toolDays)].join(','));
  lines.push(''); lines.push(['รหัส','เครื่องมือ','เบิก (ครั้ง)','อยู่นอกออฟฟิศ (วัน)'].map(q).join(','));
  M.tools.forEach(t => lines.push([q(t.code),q(t.name),t.times,r1(t.days)].join(',')));
  lines.push(''); lines.push(['ผู้เบิก','ครั้ง','ชิ้น','เครื่องมือ-วัน'].map(q).join(','));
  M.people.forEach(r => lines.push([q(r.name),r.times,r.tools.size,r1(r.days)].join(',')));
  lines.push(''); lines.push(['ไซต์','ครั้ง','ชิ้น','เครื่องมือ-วัน'].map(q).join(','));
  M.sites.forEach(r => lines.push([q(r.name),r.times,r.tools.size,r1(r.days)].join(',')));
  lines.push(''); lines.push(['รหัส','เครื่องมือ','ผู้เบิก','จาก','ไซต์','วันออก','กำหนดคืน','วันสิ้นสุด','ผลลัพธ์','วัตถุประสงค์'].map(q).join(','));
  M.inMonth.slice().reverse().forEach(m => lines.push([m.toolCode,m.toolName,m.person,m.fromSite||OFFICE,m.site,fmtDT(m.outAt),m.dueAt?fmtD(m.dueAt):'',m.backAt?fmtDT(m.backAt):'',
    !m.backAt?'ยังไม่คืน':m.endType==='transferred'?'ส่งต่อ':'คืนแล้ว', m.purpose].map(q).join(',')));
  const data = '﻿' + lines.join('\r\n');
  try {
    const dl = window.claude && await window.claude.use('downloads');
    if(!dl){ toast('ดาวน์โหลดไม่ได้ในมุมมองนี้', true); return; }
    await dl.save({filename:`สรุปเครื่องมือ-CON89-${S.month}.csv`, data: new Blob([data],{type:'text/csv;charset=utf-8'})});
  } catch(e){ if(e && e.code && e.code!=='cancelled' && e.code!=='declined') toast('ดาวน์โหลดไม่สำเร็จ', true); }
}

/* ---------- modal ---------- */
let lastFocus = null;
function openSheet(html, onSubmit){
  lastFocus = document.activeElement;
  $('#sheet').innerHTML = html; $('#modal').hidden = false;
  const f = $('#sheet form');
  if(f){
    f.addEventListener('submit', async ev => {
      ev.preventDefault();
      const btn = f.querySelector('[type=submit]'); const err = f.querySelector('.err');
      const res = onSubmit(Object.fromEntries(new FormData(f).entries()));
      if(typeof res === 'string'){ err.textContent = res; return; }
      btn.disabled = true;
      const ok = await res; btn.disabled = false;
      if(ok) closeSheet();
    });
    const first = f.querySelector('input,select,textarea'); first && first.focus();
  } else { const b = $('#sheet button'); b && b.focus(); }
}
function closeSheet(){ $('#modal').hidden = true; $('#sheet').innerHTML = ''; lastFocus && lastFocus.focus && lastFocus.focus(); }
const foot = label => `<div class="err" aria-live="polite"></div><div class="foot"><button type="button" class="btn" data-act="close">ยกเลิก</button><button type="submit" class="btn primary">${label}</button></div>`;

        await db.doc('moves/'+m.id).update({backAt:at, endType:'transferred'});
        await db.collection('moves').doc().set({toolId:t.id, toolCode:t.code, toolName:t.name, person:v.person.trim(), site:v.site.trim(),
          purpose:v.purpose.trim(), outAt:at, dueAt:v.dueAt||null, backAt:null, endType:null, fromSite:m.site, createdAt:new Date().toISOString()});
      }, `ส่งต่อ ${t.code} ไป ${v.site.trim()} แล้ว`);
    });
}

function returnForm(t){
  const m = openMove(t.id); if(!m) return;
  openSheet(`<h2>คืนเครื่องมือเข้าออฟฟิศ</h2><p class="sub"><span class="tag">${esc(t.code)}</span> ${esc(t.name)}</p>
    <form class="f" novalidate>
      <div class="route"><b>${esc(m.site)}</b><span class="arrow">→</span><span>${esc(OFFICE)}</span></div>
      <dl class="dl"><dt>ผู้เบิก</dt><dd>${esc(m.person)}</dd><dt>ออกเมื่อ</dt><dd>${fmtDT(m.outAt)}</dd>${m.dueAt?`<dt>กำหนดคืน</dt><dd>${fmtD(m.dueAt)}</dd>`:''}</dl>
      <div class="two">
        <label><span>วันเวลาที่คืน</span><input id="r-at" name="at" type="datetime-local" value="${nowLocal()}"></label>
        <label><span>สภาพตอนคืน</span><select id="r-cond" name="cond">${Object.entries(COND).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
      </div>
      <label><span>หมายเหตุ</span><input id="r-note" name="note" placeholder="เช่น ดอกสว่านหาย 1 ดอก"></label>
      ${foot('ยืนยันการคืน')}
    </form>`, v => {
      const at = toISO(v.at);
      if(new Date(at) < new Date(m.outAt)) return 'วันที่คืนต้องไม่ก่อนวันที่เบิก';
      return write(async () => {
        await db.doc('moves/'+m.id).update({backAt:at, endType:'returned', returnCond:v.cond, returnNote:v.note.trim()});
        if((t.condition||'ok') !== v.cond) await db.doc('tools/'+t.id).update({condition:v.cond});
      }, `${t.code} กลับเข้าออฟฟิศแล้ว`);
    });
}

function detailSheet(t){
  const st = toolState(t);
  const hist = moves.filter(m => m.toolId===t.id).slice().sort((a,b)=> a.outAt<b.outAt?-1:1);
  const steps = [];
  hist.forEach(m => {
    steps.push(`<li><span class="dot"></span><div><div class="t">${m.fromSite?'ส่งต่อไป':'เบิกไป'} ${esc(m.site)}</div><div class="d">${esc(m.person)} · ${fmtDT(m.outAt)}${m.purpose?' · '+esc(m.purpose):''}</div></div></li>`);
    if(m.backAt && m.endType==='returned') steps.push(`<li><span class="dot home"></span><div><div class="t">คืนเข้า${esc(OFFICE)}</div><div class="d">${fmtDT(m.backAt)} · ${n1(daysBetween(new Date(m.outAt),new Date(m.backAt)))} วัน${m.returnCond&&m.returnCond!=='ok'?' · สภาพ'+COND[m.returnCond]:''}${m.returnNote?' · '+esc(m.returnNote):''}</div></div></li>`);
  });
  steps.reverse();
  const now = st.kind==='home' ? `อยู่ที่ ${esc(OFFICE)}` : `อยู่ที่ ${esc(st.m.site)} กับ ${esc(st.m.person)}`;
  const src = photoSrc(t);
  openSheet(`<h2>${esc(t.name)}</h2><p class="sub"><span class="tag">${esc(t.code)}</span> ${esc([t.category,t.brand].filter(Boolean).join(' · '))}</p>
    <div class="photo" data-photo-of="${t.id}">${src ? `<img src="${src}" alt="รูป ${esc(t.name)}" onerror="this.parentNode.textContent='โหลดรูปไม่ได้'">` : 'ยังไม่มีรูป'}</div>
    ${assets && canWrite ? `<div class="photo-bar"><label class="btn sm" for="ph-${t.id}">${src?'เปลี่ยนรูป':'เพิ่มรูป'}</label>
      <input id="ph-${t.id}" type="file" accept="image/*" data-photo-input="${t.id}"><span class="meta">ถ่ายจากมือถือหรือเลือกไฟล์ได้</span></div>` : ''}
    <dl class="dl"><dt>ตอนนี้</dt><dd>${now}</dd>${t.serial?`<dt>Serial</dt><dd>${esc(t.serial)}</dd>`:''}<dt>สภาพ</dt><dd>${COND[t.condition||'ok']}</dd>${t.note?`<dt>หมายเหตุ</dt><dd>${esc(t.note)}</dd>`:''}</dl>
    <div class="qrrow"><button class="qrmini" data-act="qrshow" data-id="${t.id}" aria-label="ขยาย QR">${qrSVG(t)}</button>
      <div class="meta">QR ของเครื่องมือชิ้นนี้ แตะเพื่อขยาย หรือกด “ดาวน์โหลด QR” ไปพิมพ์ติดเครื่องมือ</div></div>
    <h3 style="font-size:16px">เส้นทางเครื่องมือ</h3>
    ${steps.length ? `<ol class="timeline">${steps.join('')}<li><span class="dot home"></span><div><div class="t">ลงทะเบียนที่${esc(OFFICE)}</div><div class="d">${t.createdAt?fmtD(t.createdAt):''}</div></div></li></ol>` : '<p class="meta">ยังไม่เคยถูกเบิกออกจากออฟฟิศ</p>'}
    <div class="foot" style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap">
      <button class="btn" data-act="qr" data-id="${t.id}">ดาวน์โหลด QR</button>
      ${canWrite&&db?`<button class="btn" data-act="editTool" data-id="${t.id}">แก้ไขข้อมูล</button>`:''}
      ${canWrite&&db ? (st.kind==='home'
        ? `<button class="btn primary" data-act="checkout" data-id="${t.id}">เบิก</button>`
        : `<button class="btn" data-act="transfer" data-id="${t.id}">ส่งต่อ</button><button class="btn primary" data-act="return" data-id="${t.id}">คืน</button>`)
        : `<button class="btn primary" data-act="close">ปิด</button>`}
      </div>`);
}

function confirmSheet(title, text, label, fn){
  openSheet(`<h2>${title}</h2><p style="margin:0">${text}</p>
    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" data-act="close">ยกเลิก</button><button class="btn danger" id="cfm">${label}</button></div>`);
  $('#cfm').addEventListener('click', async e => { e.target.disabled = true; if(await fn()) closeSheet(); else e.target.disabled = false; });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('.tab'); if(tab){ S.tab = tab.dataset.tab; render(); return; }
  const stat = e.target.closest('.stat'); if(stat){ S.filter = stat.dataset.filter; render(); return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const t = a.dataset.id && toolById(a.dataset.id);
  switch(a.dataset.act){
    case 'close': closeSheet(); break;
    case 'addTool': toolForm(); break;
    case 'detail': t && detailSheet(t); break;
    case 'editTool': t && toolForm(t); break;
    case 'qr': t && downloadQR(t); break;
    case 'qrshow': t && qrSheet(t); break;
    case 'checkout': t && checkoutForm(t); break;
    case 'transfer': t && transferForm(t); break;
    case 'return': t && returnForm(t); break;
    case 'delTool': {
      const tt = toolById(a.dataset.id); if(!tt) break;
      if(openMove(tt.id)){ toast('คืนเครื่องมือเข้าออฟฟิศก่อนจึงจะลบได้', true); break; }
      confirmSheet('ลบเครื่องมือ', `ลบ <span class="tag">${esc(tt.code)}</span> ${esc(tt.name)} ออกจากทะเบียน? ประวัติการเบิกเดิมยังเก็บไว้ในสรุปรายเดือน`, 'ลบ', () => write(() => db.doc('tools/'+tt.id).delete(), 'ลบแล้ว'));
      break; }
    case 'delMove': {
      const m = moves.find(x => x.id===a.dataset.id); if(!m) break;
      confirmSheet('ลบรายการเบิก', `ลบรายการ ${esc(m.toolCode)} · ${esc(m.person)} → ${esc(m.site)} (${fmtD(m.outAt)})? ใช้เมื่อบันทึกผิดเท่านั้น`, 'ลบรายการ', () => write(() => db.doc('moves/'+m.id).delete(), 'ลบรายการแล้ว'));
      break; }
  }
});
$('#btnAddTool').addEventListener('click', () => { if(!db){ toast('ยังไม่ได้เชื่อมต่อฐานข้อมูล', true); return; } toolForm(); });
$('#modal').addEventListener('click', e => { if(e.target.id==='modal') closeSheet(); });
$('#modal').addEventListener('change', e => {
  const id = e.target.dataset && e.target.dataset.photoInput; if(!id) return;
  const t = toolById(id); const f = e.target.files && e.target.files[0]; e.target.value = '';
  if(t && f) setPhoto(t, f);
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#modal').hidden) closeSheet(); });
$('#q').addEventListener('input', e => { S.q = e.target.value; renderBoard(); });
$('#cat').addEventListener('change', e => { S.cat = e.target.value; renderBoard(); });
$('#hq').addEventListener('input', e => { S.hq = e.target.value; renderHistory(); });
$('#hmonth').addEventListener('change', e => { S.hmonth = e.target.value; renderHistory(); });
function shiftMonth(d){ const [y,m] = S.month.split('-').map(Number); S.month = ymKey(new Date(y, m-1+d, 1)); renderMonth(); }
$('#mPrev').addEventListener('click', () => shiftMonth(-1));
$('#mNext').addEventListener('click', () => shiftMonth(1));
$('#btnCsv').addEventListener('click', downloadCsv);
setInterval(() => { if($('#modal').hidden && S.tab==='board') renderBoard(); }, 60000);

let toastT;
function toast(msg, bad){ const el = $('#toast'); el.textContent = msg; el.className = 'toast' + (bad?' bad':''); el.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=> el.hidden = true, 3200); }
</script>

</body>
</html>
